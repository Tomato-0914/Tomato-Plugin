# 默认配置。要改的话复制一份为 config/config.yaml 再改，
# 只写你想覆盖的项即可；本文件在插件升级时会被覆盖。

# 插件优先级，数字越小越先响应（可以是负数，改完重启生效）
# 默认 -100：喵喵插件自己没设优先级（用的是 Yunzai 默认值，通常是 50），
# -100 保证稳稳抢在逍遥、喵喵、Atlas 等插件前面接管“#xx图鉴”；不想接管就调大
priority: -100

# 这些分类的条目不响应，交给其他插件处理；默认不跳过任何分类（角色图鉴已经自己做了）
skipCategories: []

# 这些分类整个不收录：不查询、不拉详情、不出图、不缓存，#图鉴分类 里也不显示（条目多、以纯文本为主、几乎没人查，
# 或者时效性强、其他插件做得更好）。和 skipCategories 的区别是这里连目录都不收，已有的详情/图片缓存也会删掉；
# 从列表里删掉某个分类后，发 #图鉴更新 重新拉目录才会恢复
excludeCategories: [成就, 任务, 地图文本, 教程, 洞天, NPC&商店, 活动, 深境螺旋, 幻想真境剧诗, 幽境危战]

# 为 true 时，#护摩之杖、护摩之杖 这种不带“图鉴”二字的消息也会触发（可接管 Atlas 的同类指令）
# 只在精确名称、别名或料理名命中时才响应，其余交给别的插件
bareMatch: true

# 直接发名称（不带 # 或不带“图鉴”）只对这些分类生效；其余分类（如背包道具）要发 #名称图鉴 或 #图鉴名称
bareCategories: [武器, 圣遗物, 食物, 敌人, 秘境]

# 日常用词或和其他插件指令重名的条目，只认 #名称图鉴 / #图鉴名称
strictTitles: [
  苹果, 日落果, 树莓, 泡泡桔, 墩墩桃, 甜甜花, 胡萝卜, 白萝卜, 薄荷, 蘑菇, 松茸, 竹笋, 莲蓬, 海草,
  鸟蛋, 兽肉, 禽肉, 鱼肉, 冷鲜肉, 鳗肉, 神秘的肉, 螃蟹, 虾仁, 蟹黄, 火腿, 香肠, 培根,
  奶油, 黄油, 奶酪, 牛奶, 面粉, 稻米, 小麦, 番茄, 洋葱, 土豆, 卷心菜, 杏仁, 豆腐,
  盐, 糖, 胡椒, 果酱, 咖啡豆, 香辛料, 巧克力, 米饭, 面包,
  原石, 摩拉, 丘丘人, 史莱姆, 盗宝团
]

# 生成图片前先回一句“正在生成”（用图片缓存直接发送时不提示）
renderTip: true

# 图片缓存：渲染好的图存到 data/Tomato-Plugin/gs/Atlas/<分类>/<图鉴名>/1.jpg、2.jpg…（如 Atlas/角色/兹白/），下次查同一条直接发本地图，
# 不再拉数据也不再渲染。缓存不会自动过期，数据不对时发 #图鉴清除缓存<名称> 或 #图鉴清除图片缓存<名称> 重新生成；
# 改了渲染精度/图片质量、或插件更新改了模板时旧图自动作废。设为 false 则每次都重新生成（已有的缓存文件保留不删）
imageCache: true

# 定时清空图片缓存的 cron 表达式，留空则不定时清理。默认每周三凌晨 4 点清一次：
# 新角色/新武器刚上线时观测枢数据常常不全，隔一阵自动重出，就不会一直发旧图。
# 推荐在锅巴里用 Cron 选择器选，生成的是 7 段 Quartz 写法：秒 分 时 日 月 周 年（周日=1、周一=2…周六=7，? 表示不指定），
# 插件会自动转换成 Yunzai 能用的格式；手写 Linux 风格的 5 段（分 时 日 月 周）或 6 段（秒 分 时 日 月 周，周日=0）也认
imageCacheCron: '0 0 4 * * 4 *'

# 图片渲染精度（50~300，默认 100）；数值越大图片越清晰，体积也越大
renderScale: 100

# 图片张数超过这个值时改用合并转发
forwardThreshold: 2

api:
  timeout: 15000      # 单次请求超时（毫秒）
  indexTTL: 21600     # 目录缓存（秒），6 小时
  detailTTL: 43200    # 详情缓存（秒），12 小时
  # 内容 id 大于等于这个值先走新版 hoyowiki 接口，否则先走旧版 blackboard 接口；
  # 默认 0 表示全部先走新接口，查不到时自动退回旧接口
  detailIdSplit: 0

games:
  gs:
    name: 原神
    base: https://api-static.mihoyo.com/common/blackboard/ys_obc/v1
    appSn: ys_obc
    channelId: 189
    # 新版词条接口（默认所有条目优先使用）
    newBase: https://api-takumi.mihoyo.com/hoyowiki/genshin/wapi
    # 同名条目出现在多个分类时，按这个顺序优先
    categoryPriority: [角色, 武器, 圣遗物]

weapon:
  # 喵喵插件的武器立绘目录（相对 Yunzai 根目录），找不到对应图片时用观测枢图标
  artDir: plugins/miao-plugin/resources/meta-gs/weapon
  # 突破材料名称包含这些字时，标题后显示对应的秘境开放日；匹配不到就不显示
  domainDays:
    周一/四/日: [高塔孤王, 孤云寒林, 远海夷地, 谧林涓露, 悠古弦音, 贡祭炽心]
    周二/五/日: [凛风奔狼, 雾海云间, 鸣神御灵, 绿洲花园, 纯圣露滴, 谵妄圣主]
    周三/六/日: [狮牙斗士, 漆黑陨铁, 今昔剧画, 烈日威权, 无垢之海, 神合秘烟]

artifact:
  # 喵喵插件的圣遗物部件立绘目录（相对 Yunzai 根目录，透明底），找不到对应图片时用观测枢图标
  artDir: plugins/miao-plugin/resources/meta-gs/artifact/imgs

material:
  # 喵喵插件的材料/掉落物图标目录（相对 Yunzai 根目录，透明底），涵盖武器突破材料、地区特产、怪物掉落等；
  # 用在武器升级材料、敌人掉落物品、秘境可能掉落上；找不到（含食物加工材料，喵喵插件没有）时用观测枢图标
  artDir: plugins/miao-plugin/resources/meta-gs/material

character:
  # 喵喵插件的角色资源目录（相对 Yunzai 根目录），用角色立绘（imgs/gacha.webp）和命之座图标（icons/cons-N.webp）；
  # 找不到（新角色喵喵还没更新，或者没装喵喵插件）时用观测枢自己的图
  artDir: plugins/miao-plugin/resources/meta-gs/character

render:
  quality: 90         # JPEG 质量
  timeout: 60000      # 等待页面和图片加载的上限（毫秒）
  pageHeight: 3500    # 超过这个高度会切成多张图
  maxSections: 30
  # 分段名包含这些字的整段跳过（新版词条按模块名，旧版按段名）
  # 新版真实模块名：角色故事N / 配音展示 / 关联词条 / 角色CV 等
  excludeSections: [角色故事, 配音, 语音, 关联词条]
  # 渲染前从正文里删掉的元素（CSS 选择器）
  removeSelectors:
    - '[class*="voice"]'
    - '[class*="-mobile"]'
    - '[class*="__mobile"]'
  # 让米游社 CDN 先缩图再传过来，省带宽；图片显示不出来就改成 ''
  imageProcess: image/resize,w_720/quality,q_85/format,webp
  imageHosts:
    - upload-bbs.miyoushe.com
    - upload-bbs.mihoyo.com
    - act-upload.mihoyo.com
    - uploadstatic.mihoyo.com

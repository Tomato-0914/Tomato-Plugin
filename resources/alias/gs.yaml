# 格式：官方名称: [别名1, 别名2]
# 带“图鉴”查询时，名称的一部分（比如“雾切图鉴”→雾切之回光）不用写，插件会自动模糊匹配；
# 不带“图鉴”时只认完整名称和这里的别名。
# 想加自己的别名，写到 config/alias/gs.yaml，格式一样，升级不会被覆盖。
温迪: [风神, 巴巴托斯]
钟离: [岩神, 摩拉克斯, 帝君]
雷电将军: [雷神]
纳西妲: [草神, 小吉祥草王, 草王]
芙宁娜: [水神, 芙芙]
玛薇卡: [火神]
流浪者: [散兵, 阿帽]
达达利亚: [公子]
枫原万叶: [万叶]
八重神子: [神子]
珊瑚宫心海: [心海]
神里绫华: [绫华]
神里绫人: [绫人]
荒泷一斗: [一斗]
鹿野院平藏: [平藏]
九条裟罗: [裟罗]

